
CONFIG_DEBUG=n
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=4000
CONFIG_LOG_BUFFER_SIZE=1024


#CONFIG_LOG_BACKEND_UART=y
#CONFIG_LOG_BACKEND_UART=y
#CONFIG_USE_SEGGER_RTT=y
#CONFIG_PRINTK=y

#CONFIG_LOG_PRINTK=y
#CONFIG_LOG_BACKEND_RTT=y

CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=800

#CONFIG_BT_CTLR=y
# Match the single connection supported by the application core.
CONFIG_BT_MAX_CONN=1
# Select the NCS controller Tx Power choice for the required +3 dBm output.
CONFIG_BT_CTLR_TX_PWR_PLUS_3=y
# Size the HCI ACL buffers so the controller enables Data Length Extension and
# can negotiate the maximum 251-byte link-layer PDU.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
