CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_CREATE_CONN_TIMEOUT=10
CONFIG_SOC_NRF53_CPUNET_ENABLE=y
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_LED=y
CONFIG_LED_GPIO=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="SenseLab Bridge Central"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=2048
# OpenAMP allocation budget normally supplied by the DK's HCI IPC defaults.
CONFIG_HEAP_MEM_POOL_SIZE=4096
