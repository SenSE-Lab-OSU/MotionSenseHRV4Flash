CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_ESB=y
CONFIG_DK_LIBRARY=y
CONFIG_CLOCK_CONTROL=y

# Transmit period. RTC0 supplies the 32.768 kHz timebase.
CONFIG_ESB_PTX_TX_INTERVAL_MS=500

# LF clock source. The SDK bypass patch below configures the LFXO path for
# our external 32.768 kHz clock.
CONFIG_SOC_ENABLE_LFXO=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_SOC_LFXO_CAP_EXTERNAL=y
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_EXT_FULL_SWING=y # What we want, but not supported on nRF5340. Hacked the SDK instead.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y

# LFXO bypass is for a rail-to-rail external clock source.
CONFIG_SOC_LFXO_BYPASS=y
CONFIG_SOC_HFXO_CAP_INTERNAL=y
CONFIG_SOC_HFXO_CAP_INT_VALUE_X2=25
