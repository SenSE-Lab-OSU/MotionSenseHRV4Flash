CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="SenseLab Bridge FPGA Dev"
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_LOG=y
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# Shared Bridge board GPIOs and FPGA runtime SPI transport.
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_SPI=n
CONFIG_TIMING_FUNCTIONS=y
# Use Nordic TIMER2 so elapsed time includes CPU sleep during the SPI wait.
CONFIG_CORTEX_M_DWT=n
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Allow pasted shell commands in one USB burst.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_FPGA_FLASH_WRITE=y
