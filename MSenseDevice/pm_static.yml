# Static partition map pinned to the layout produced by the NCS v2.5.3 build.
#
# The MCUboot on fielded devices is immutable (no b0/s0/s1 in this project), so
# its slot geometry is frozen at whatever the 2.5.3 build produced:
#   mcuboot_primary   0x28000, size 0x6c000
#   mcuboot_secondary 0x94000, size 0x6c000
# Any build that is meant to be delivered to those devices over DFU must use the
# exact same addresses, or the running application and the bootloader will
# disagree about where the image trailers live and the confirm flag will be
# written where MCUboot never reads it.
#
# Do NOT let Partition Manager allocate anything out of internal flash here
# (settings_storage in particular) -- there is no free space left, and the only
# gap, 0x25000-0x28000, is inside the region MCUboot fprotects at boot
# (0x0 .. PM_MCUBOOT_PRIMARY_ADDRESS), so writes to it fault.

mcuboot:
  address: 0x0
  end_address: 0x25000
  size: 0x25000
  region: flash_primary

EMPTY_0:
  address: 0x25000
  end_address: 0x28000
  size: 0x3000
  region: flash_primary
  placement:
    before:
    - mcuboot_pad

mcuboot_pad:
  address: 0x28000
  end_address: 0x28200
  size: 0x200
  region: flash_primary

mcuboot_primary:
  address: 0x28000
  end_address: 0x94000
  size: 0x6c000
  region: flash_primary
  span: &id001
  - mcuboot_pad
  - app
  orig_span: *id001

mcuboot_primary_app:
  address: 0x28200
  end_address: 0x94000
  size: 0x6be00
  region: flash_primary
  span: &id002
  - app
  orig_span: *id002

app:
  address: 0x28200
  end_address: 0x94000
  size: 0x6be00
  region: flash_primary

mcuboot_secondary:
  address: 0x94000
  end_address: 0x100000
  size: 0x6c000
  region: flash_primary
