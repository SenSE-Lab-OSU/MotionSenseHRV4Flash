# Board GPIO hogs establish safe levels; retain application-core GPIO ownership.
CONFIG_SOC_NRF53_CPUNET_ENABLE=y
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_LED=y
CONFIG_LED_GPIO=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="SenseLab Bridge"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_BOOT_BANNER=n
