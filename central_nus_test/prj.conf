# Bluetooth LE Central and GATT client
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_DFU_SMP=y
CONFIG_BT_MAX_CONN=1
# GATT Discovery Manager allocates discovery data from the kernel heap.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Request the same large ATT MTU used by the PPG and ECG firmware. The protocol
# minimum is 128 bytes, but 498 keeps the test transfer reasonably quick.
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_COUNT=16
# A 498-byte ATT write fragments into three 251-byte LL packets. Keep enough
# host and L2CAP buffers for one SMP upload request without starving discovery.
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_ATT_TX_COUNT=8
# Retain automatic link updates while exposing their negotiated results in
# bt_conn callbacks for the throughput report.
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y

# Two application-owned UARTEs connected to the DK interface MCU.
# The relay uses the asynchronous API; the command port needs RX interrupts.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y

# Keep the VCOM ports deterministic: this tester writes its own text control
# protocol and binary relay, so no console or logging backend owns either port.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_PRINTK=y

# Keep RTT as the only diagnostics/logging backend so neither VCOM port is
# claimed by console or logging output.
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HW_STACK_PROTECTION=y

# DFU parsing and MCUmgr CBOR encoding run on the dedicated DFU thread. BLE
# link authentication remains intentionally optional; no pairing or keys are
# required by the default v1 configuration.
CONFIG_ZCBOR=y
CONFIG_ZCBOR_STOP_ON_ERROR=y
