# The nRF54L15 DK does not support the UARTE0 nrfx driver instance. This
# matches Nordic's central_uart configuration for this board target.
CONFIG_NRFX_UARTE0=n

# UARTE20 is the VCOM1 binary relay and must use async TX. UARTE30 remains
# interrupt-driven for line-oriented VCOM0 command reception.
CONFIG_UART_20_INTERRUPT_DRIVEN=n
CONFIG_UART_20_ASYNC=y
